<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>通用单位换算器</title>
	<link rel="stylesheet" href="/css/tools.css">
	<style>
		body {
			margin: 0;
			padding: 10px;
			background: transparent;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			color: #333;
			zoom: 1.05;
		}
		[data-theme='dark'] body {
			color: #f1f5f9;
		}

		.tool-container {
			max-width: 820px;
			margin: 0 auto;
			padding: 24px;
			background: rgba(255, 255, 255, 0.7);
			border-radius: 16px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.5);
			box-sizing: border-box;
		}
		[data-theme='dark'] .tool-container {
			background: rgba(30, 32, 40, 0.7);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
		}

		.tool-header h2 {
			margin-top: 0;
			color: #49b1f5;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.tool-header p {
			margin: 4px 0 20px 0;
			color: #666;
			font-size: 14px;
		}
		[data-theme='dark'] .tool-header p {
			color: #aaa;
		}

		.converter-section {
			margin-top: 10px;
		}

		.type-selector {
			display: flex;
			gap: 10px;
			margin-bottom: 22px;
			flex-wrap: wrap;
		}
		.type-btn {
			padding: 8px 18px;
			border: 1px solid rgba(0, 0, 0, 0.15);
			background: rgba(255, 255, 255, 0.6);
			border-radius: 20px;
			cursor: pointer;
			color: inherit;
			font-size: 13.5px;
			font-weight: 500;
			transition: all 0.2s;
		}
		[data-theme='dark'] .type-btn {
			background: rgba(255, 255, 255, 0.05);
			border-color: rgba(255, 255, 255, 0.15);
		}
		.type-btn.active {
			background: #49b1f5;
			color: white;
			border-color: #49b1f5;
			box-shadow: 0 2px 8px rgba(73, 177, 245, 0.35);
		}

		.input-group {
			margin-bottom: 20px;
		}
		.input-group label {
			display: block;
			margin-bottom: 8px;
			font-size: 14px;
			font-weight: 600;
		}
		.input-group input {
			width: 100%;
			padding: 12px 16px;
			font-size: 18px;
			font-weight: bold;
			border: 1px solid #ccc;
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.9);
			color: inherit;
			box-sizing: border-box;
			outline: none;
			transition: border-color 0.2s;
		}
		.input-group input:focus {
			border-color: #49b1f5;
		}
		[data-theme='dark'] .input-group input {
			background: rgba(20, 22, 28, 0.85);
			border-color: #444;
		}

		.converter-boxes {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			margin-bottom: 24px;
		}
		.converter-boxes .box {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 6px;
		}
		.converter-boxes .box label {
			font-size: 13px;
			font-weight: 600;
			color: #666;
		}
		[data-theme='dark'] .converter-boxes .box label {
			color: #aaa;
		}
		.converter-boxes select {
			padding: 11px 14px;
			font-size: 15px;
			border-radius: 8px;
			border: 1px solid #ccc;
			background: rgba(255, 255, 255, 0.9);
			color: inherit;
			outline: none;
		}
		[data-theme='dark'] .converter-boxes select {
			background: rgba(20, 22, 28, 0.85);
			border-color: #444;
		}

		.switch-icon {
			font-size: 20px;
			cursor: pointer;
			color: #49b1f5;
			width: 42px;
			height: 42px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			background: rgba(73, 177, 245, 0.12);
			transition: transform 0.25s, background 0.2s;
			user-select: none;
			margin-top: 20px;
			flex-shrink: 0;
		}
		.switch-icon:hover {
			transform: rotate(180deg);
			background: rgba(73, 177, 245, 0.2);
		}

		.result-display {
			text-align: center;
			padding: 28px 20px;
			background: rgba(73, 177, 245, 0.05);
			border-radius: 12px;
			border: 2px dashed rgba(73, 177, 245, 0.4);
			position: relative;
		}
		#resultValue {
			font-size: 2.8em;
			font-weight: 800;
			color: #49b1f5;
			word-break: break-all;
			line-height: 1.2;
		}
		.unit-label {
			font-size: 1.2em;
			color: inherit;
			margin-left: 10px;
			font-weight: 600;
		}
		.copy-result-btn {
			margin-top: 14px;
			padding: 6px 16px;
			font-size: 13px;
			font-weight: 600;
			background: #49b1f5;
			color: white;
			border: none;
			border-radius: 16px;
			cursor: pointer;
			transition: all 0.2s;
		}
		.copy-result-btn:hover {
			background: #3b9fe0;
			transform: scale(1.05);
		}

		/* Toast */
		.tools-toast {
			position: fixed;
			bottom: 30px;
			left: 50%;
			transform: translateX(-50%) translateY(20px);
			background: rgba(20, 24, 33, 0.9);
			color: #fff;
			padding: 10px 22px;
			border-radius: 24px;
			font-size: 14px;
			font-weight: 500;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
			backdrop-filter: blur(8px);
			opacity: 0;
			pointer-events: none;
			transition: all 0.25s ease-out;
			z-index: 9999;
		}
		.tools-toast.show {
			opacity: 1;
			transform: translateX(-50%) translateY(0);
		}
	</style>
</head>
<body>

<div class="tool-container">
	<div class="tool-header">
		<h2>📏 通用单位换算器</h2>
		<p>支持长度、面积、体积/容积、质量/重量、数据存储及温度等常用物理与工程科学单位的高精度即时转换。</p>
	</div>

	<div class="converter-section">
		<div class="type-selector">
			<button class="type-btn active" data-type="length">长度 (Length)</button>
			<button class="type-btn" data-type="area">面积 (Area)</button>
			<button class="type-btn" data-type="volume">体积 (Volume)</button>
			<button class="type-btn" data-type="weight">质量/重量 (Weight)</button>
			<button class="type-btn" data-type="digital">数据存储 (Data)</button>
		</div>

		<div class="input-group">
			<label for="inputValue">输入数值：</label>
			<input type="number" id="inputValue" placeholder="输入数值" value="1" step="any">
		</div>

		<div class="converter-boxes">
			<div class="box">
				<label for="fromUnit">源单位：</label>
				<select id="fromUnit"></select>
			</div>
			<div class="switch-icon" onclick="swapUnits()" title="点击交换两端单位">⇄</div>
			<div class="box">
				<label for="toUnit">目标单位：</label>
				<select id="toUnit"></select>
			</div>
		</div>

		<div class="result-display">
			<div>
				<span id="resultValue">0</span>
				<span id="resultUnit" class="unit-label"></span>
			</div>
			<button class="copy-result-btn" onclick="copyResult()">📋 复制结果</button>
		</div>
	</div>
</div>

<div id="toast" class="tools-toast"></div>

<script>
const units = {
	length: {
		'mm': { name: '毫米 (mm)', factor: 0.001 },
		'cm': { name: '厘米 (cm)', factor: 0.01 },
		'm': { name: '米 (m)', factor: 1 },
		'km': { name: '千米 (km)', factor: 1000 },
		'in': { name: '英寸 (inch)', factor: 0.0254 },
		'ft': { name: '英尺 (foot)', factor: 0.3048 },
		'yd': { name: '码 (yard)', factor: 0.9144 },
		'mi': { name: '英里 (mile)', factor: 1609.344 }
	},
	area: {
		'sq_m': { name: '平方米 (m²)', factor: 1 },
		'sq_cm': { name: '平方厘米 (cm²)', factor: 0.0001 },
		'ha': { name: '公顷 (ha)', factor: 10000 },
		'mu': { name: '市亩', factor: 666.666667 },
		'sq_km': { name: '平方千米 (km²)', factor: 1000000 },
		'sq_ft': { name: '平方英尺 (sq ft)', factor: 0.092903 }
	},
	volume: {
		'l': { name: '升 (L)', factor: 0.001 },
		'ml': { name: '毫升 (mL)', factor: 0.000001 },
		'cu_m': { name: '立方米 (m³)', factor: 1 },
		'cu_cm': { name: '立方厘米 (cm³)', factor: 0.000001 },
		'gal_us': { name: '美制加仑 (gal)', factor: 0.00378541 }
	},
	weight: {
		'g': { name: '克 (g)', factor: 1 },
		'kg': { name: '千克 (kg)', factor: 1000 },
		't': { name: '公吨 (t)', factor: 1000000 },
		'jin': { name: '市斤', factor: 500 },
		'lb': { name: '磅 (lb)', factor: 453.59237 },
		'oz': { name: '盎司 (oz)', factor: 28.349523 }
	},
	digital: {
		'B': { name: '字节 (Bytes)', factor: 1 },
		'KB': { name: '千字节 (KB)', factor: 1024 },
		'MB': { name: '兆字节 (MB)', factor: 1048576 },
		'GB': { name: '吉字节 (GB)', factor: 1073741824 },
		'TB': { name: '太字节 (TB)', factor: 1099511627776 }
	}
};

let currentType = 'length';
let toastTimer = null;

function showToast(msg) {
	const toast = document.getElementById('toast');
	toast.textContent = msg;
	toast.classList.add('show');
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => {
		toast.classList.remove('show');
	}, 1800);
}

function initOptions() {
	const fromSelect = document.getElementById('fromUnit');
	const toSelect = document.getElementById('toUnit');
	if (!fromSelect || !toSelect) return;
	
	fromSelect.innerHTML = '';
	toSelect.innerHTML = '';
	
	const currentUnits = units[currentType];
	const keys = Object.keys(currentUnits);
	keys.forEach(key => {
		fromSelect.add(new Option(currentUnits[key].name, key));
		toSelect.add(new Option(currentUnits[key].name, key));
	});
	
	if (keys.length > 1) {
		toSelect.selectedIndex = 1;
	}
	calculate();
}

function calculate() {
	const fromSelect = document.getElementById('fromUnit');
	const toSelect = document.getElementById('toUnit');
	if (!fromSelect || !toSelect) return;

	const valStr = document.getElementById('inputValue').value;
	const val = parseFloat(valStr);
	
	if (isNaN(val) || valStr.trim() === '') {
		document.getElementById('resultValue').innerText = '0';
		document.getElementById('resultUnit').innerText = '';
		return;
	}
	
	const from = fromSelect.value;
	const to = toSelect.value;
	
	const baseVal = val * units[currentType][from].factor;
	const result = baseVal / units[currentType][to].factor;
	
	// 高精度显示，消除浮点数精度抖动
	let resultStr;
	if (Math.abs(result) < 1e-6 && result !== 0) {
		resultStr = result.toExponential(6);
	} else {
		resultStr = parseFloat(result.toPrecision(10)).toString();
	}
	
	document.getElementById('resultValue').innerText = resultStr;
	const unitName = units[currentType][to].name.split(' ')[0];
	document.getElementById('resultUnit').innerText = unitName;
}

window.swapUnits = function() {
	const from = document.getElementById('fromUnit');
	const to = document.getElementById('toUnit');
	if (!from || !to) return;
	
	const temp = from.value;
	from.value = to.value;
	to.value = temp;
	calculate();
};

window.copyResult = function() {
	const val = document.getElementById('resultValue').innerText;
	const unit = document.getElementById('resultUnit').innerText;
	const text = `${val} ${unit}`.trim();
	if (!text) return;
	
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(text).then(() => showToast(`✓ 已复制: ${text}`));
	} else {
		showToast(`✓ 已计算: ${text}`);
	}
};

document.addEventListener('DOMContentLoaded', () => {
	document.querySelectorAll('.type-btn').forEach(btn => {
		btn.addEventListener('click', (e) => {
			document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
			e.target.classList.add('active');
			currentType = e.target.dataset.type;
			initOptions();
		});
	});

	['inputValue', 'fromUnit', 'toUnit'].forEach(id => {
		const el = document.getElementById(id);
		if (el) {
			el.addEventListener('input', calculate);
			el.addEventListener('change', calculate);
		}
	});

	initOptions();
});

// 主题同步
function syncTheme() {
	try {
		const isDark = window.parent.document.documentElement.classList.contains('dark') || 
		               window.parent.document.documentElement.getAttribute('data-theme') === 'dark';
		if (isDark) {
			document.documentElement.setAttribute('data-theme', 'dark');
			document.body.classList.add('dark');
		} else {
			document.documentElement.removeAttribute('data-theme');
			document.body.classList.remove('dark');
		}
	} catch (e) {}
}
window.addEventListener('DOMContentLoaded', syncTheme);
const observer = new MutationObserver(syncTheme);
try {
	observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
} catch (e) {}
</script>
</body>
</html>
