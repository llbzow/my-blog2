<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>二维码生成与解析</title>
	<link rel="stylesheet" href="/css/tools.css">
	<style>
		body {
			margin: 0;
			padding: 10px;
			background: transparent;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			color: #333;
			zoom: 1.05;
		}
		[data-theme='dark'] body {
			color: #f1f5f9;
		}

		.tool-container {
			max-width: 800px;
			margin: 0 auto;
			padding: 20px;
			background: rgba(255, 255, 255, 0.7);
			border-radius: 16px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.5);
			box-sizing: border-box;
		}
		[data-theme='dark'] .tool-container {
			background: rgba(30, 32, 40, 0.7);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
		}

		.tool-header h2 {
			margin-top: 0;
			color: #49b1f5;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.tool-header p {
			margin: 4px 0 16px 0;
			color: #666;
			font-size: 14px;
		}
		[data-theme='dark'] .tool-header p {
			color: #aaa;
		}

		.tabs {
			display: flex;
			border-bottom: 2px solid rgba(0, 0, 0, 0.08);
			margin-bottom: 20px;
		}
		[data-theme='dark'] .tabs {
			border-bottom-color: rgba(255, 255, 255, 0.08);
		}

		.tab-btn {
			flex: 1;
			padding: 12px;
			background: none;
			border: none;
			font-size: 16px;
			font-weight: bold;
			color: inherit;
			cursor: pointer;
			border-bottom: 3px solid transparent;
			transition: all 0.2s;
		}
		.tab-btn.active {
			color: #49b1f5;
			border-bottom-color: #49b1f5;
		}

		.tab-content {
			display: none;
			animation: fadeIn 0.25s ease-in;
		}
		.tab-content.active {
			display: block;
		}

		textarea {
			width: 100%;
			height: 110px;
			padding: 12px 14px;
			border-radius: 8px;
			border: 1px solid #ccc;
			background: rgba(255, 255, 255, 0.9);
			color: inherit;
			font-size: 14px;
			resize: vertical;
			box-sizing: border-box;
			font-family: inherit;
			outline: none;
			transition: border-color 0.2s;
		}
		textarea:focus {
			border-color: #49b1f5;
		}
		[data-theme='dark'] textarea {
			background: rgba(20, 22, 28, 0.8);
			border-color: #444;
		}

		.settings-row {
			display: flex;
			gap: 20px;
			margin: 15px 0;
			align-items: center;
			flex-wrap: wrap;
		}
		.setting-item {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 14px;
		}
		.setting-item input[type="color"] {
			width: 32px;
			height: 32px;
			border: none;
			border-radius: 6px;
			padding: 0;
			cursor: pointer;
			background: none;
		}
		.setting-item select {
			padding: 6px 12px;
			border-radius: 6px;
			border: 1px solid #ccc;
			background: #fff;
			color: inherit;
			outline: none;
		}
		[data-theme='dark'] .setting-item select {
			background: #252830;
			border-color: #444;
		}

		.qr-preview {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 240px;
			background: rgba(0, 0, 0, 0.03);
			border-radius: 12px;
			margin: 18px 0;
			padding: 20px;
			border: 1px dashed rgba(0, 0, 0, 0.12);
		}
		[data-theme='dark'] .qr-preview {
			background: rgba(255, 255, 255, 0.03);
			border-color: rgba(255, 255, 255, 0.1);
		}
		.qr-preview img, .qr-preview canvas {
			max-width: 100%;
			height: auto;
			border-radius: 8px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
		}
		.empty-state {
			text-align: center;
			color: #888;
			font-size: 1.05em;
			line-height: 1.6;
		}

		.action-btn {
			width: 100%;
			padding: 12px;
			font-size: 15px;
			font-weight: bold;
			border-radius: 8px;
			background: #49b1f5;
			color: white;
			border: none;
			cursor: pointer;
			transition: all 0.2s;
		}
		.action-btn:hover {
			background: #3b9fe0;
			transform: translateY(-1px);
			box-shadow: 0 4px 12px rgba(73, 177, 245, 0.35);
		}
		.action-btn.secondary {
			background: #10b981;
			margin-top: 10px;
		}
		.action-btn.secondary:hover {
			background: #059669;
			box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
		}

		.upload-area {
			border: 2px dashed #49b1f5;
			border-radius: 12px;
			padding: 35px 20px;
			text-align: center;
			cursor: pointer;
			transition: all 0.2s;
			background: rgba(73, 177, 245, 0.04);
			margin-bottom: 20px;
		}
		.upload-area:hover, .upload-area.dragover {
			background: rgba(73, 177, 245, 0.1);
			border-color: #3b9fe0;
		}
		.upload-area svg {
			color: #49b1f5;
			margin-bottom: 12px;
		}
		.upload-area p {
			margin: 0;
			font-size: 15px;
			color: inherit;
		}

		.decode-result h3 {
			margin: 0 0 8px 0;
			font-size: 15px;
		}
		.decode-result textarea {
			height: 90px;
			background: rgba(73, 177, 245, 0.05);
			border-color: #49b1f5;
		}

		/* 内置高颜值 Toast 通知 */
		.tools-toast {
			position: fixed;
			bottom: 30px;
			left: 50%;
			transform: translateX(-50%) translateY(20px);
			background: rgba(20, 24, 33, 0.9);
			color: #fff;
			padding: 10px 22px;
			border-radius: 24px;
			font-size: 14px;
			font-weight: 500;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
			backdrop-filter: blur(8px);
			opacity: 0;
			pointer-events: none;
			transition: all 0.25s ease-out;
			z-index: 9999;
		}
		.tools-toast.show {
			opacity: 1;
			transform: translateX(-50%) translateY(0);
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(6px); }
			to { opacity: 1; transform: translateY(0); }
		}
	</style>
</head>
<body>

<div class="tool-container">
	<div class="tool-header">
		<h2>📱 二维码生成与解析</h2>
		<p>纯前端实现，无需联网，快速把文本、网址转换为高清二维码，或识读本地二维码图片。</p>
	</div>

	<div class="tabs">
		<button class="tab-btn active" id="btn-tab-gen" onclick="switchTab('generate')">生成二维码</button>
		<button class="tab-btn" id="btn-tab-dec" onclick="switchTab('decode')">解析二维码</button>
	</div>

	<!-- 生成二维码 -->
	<div id="tab-generate" class="tab-content active">
		<textarea id="qrText" placeholder="请输入想要转换的链接或文本内容..." oninput="generateQR()"></textarea>
		
		<div class="settings-row">
			<div class="setting-item">
				<label>前景色:</label>
				<input type="color" id="qrColorDark" value="#000000" onchange="generateQR()">
			</div>
			<div class="setting-item">
				<label>背景色:</label>
				<input type="color" id="qrColorLight" value="#ffffff" onchange="generateQR()">
			</div>
			<div class="setting-item">
				<label>尺寸:</label>
				<select id="qrSize" onchange="generateQR()">
					<option value="200">200 px</option>
					<option value="300" selected>300 px</option>
					<option value="500">500 px</option>
				</select>
			</div>
		</div>

		<div class="qr-preview" id="qrcode-container">
			<div class="empty-state">输入文本或链接后自动生成<br>✨</div>
		</div>
		
		<button class="action-btn" onclick="downloadQR()">💾 下载高清二维码 PNG</button>
	</div>

	<!-- 解析二维码 -->
	<div id="tab-decode" class="tab-content">
		<div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
			<input type="file" id="fileInput" accept="image/*" style="display: none" onchange="handleFileSelect(event)">
			<svg viewBox="0 0 24 24" width="44" height="44" stroke="currentColor" stroke-width="2" fill="none">
				<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
				<circle cx="8.5" cy="8.5" r="1.5"></circle>
				<polyline points="21 15 16 10 5 21"></polyline>
			</svg>
			<p>点击选择二维码图片，或直接拖拽至此处识别</p>
		</div>
		
		<div class="decode-result" id="decodeResultArea" style="display: none;">
			<h3>解析文本：</h3>
			<textarea id="decodeResultText" readonly></textarea>
			<button class="action-btn secondary" onclick="copyResult()">📋 复制解析结果</button>
		</div>
	</div>
</div>

<div id="toast" class="tools-toast"></div>

<!-- 外部 CDN 库 -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
let qrcode = null;
let toastTimer = null;

function showToast(msg) {
	const toast = document.getElementById('toast');
	toast.textContent = msg;
	toast.classList.add('show');
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => {
		toast.classList.remove('show');
	}, 2000);
}

function switchTab(tabId) {
	document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
	document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
	
	document.getElementById('tab-' + tabId).classList.add('active');
	if (tabId === 'generate') {
		document.getElementById('btn-tab-gen').classList.add('active');
		if (document.getElementById('qrText').value) generateQR();
	} else {
		document.getElementById('btn-tab-dec').classList.add('active');
	}
}

function generateQR() {
	const text = document.getElementById('qrText').value.trim();
	const container = document.getElementById('qrcode-container');
	const colorDark = document.getElementById('qrColorDark').value;
	const colorLight = document.getElementById('qrColorLight').value;
	const size = parseInt(document.getElementById('qrSize').value);

	container.innerHTML = '';

	if (!text) {
		container.innerHTML = '<div class="empty-state">输入文本或链接后自动生成<br>✨</div>';
		return;
	}

	if (typeof QRCode === 'undefined') {
		container.innerHTML = '<div class="empty-state" style="color:#ef4444;">正在加载二维码引擎，请稍候...</div>';
		return;
	}

	const box = document.createElement('div');
	container.appendChild(box);

	qrcode = new QRCode(box, {
		text: text,
		width: size,
		height: size,
		colorDark: colorDark,
		colorLight: colorLight,
		correctLevel: QRCode.CorrectLevel.H
	});
}

function downloadQR() {
	const container = document.getElementById('qrcode-container');
	const img = container.querySelector('img');
	const canvas = container.querySelector('canvas');
	
	let url = '';
	if (img && img.src && !img.src.includes('clear.gif') && img.src.length > 100) {
		url = img.src;
	} else if (canvas) {
		url = canvas.toDataURL("image/png");
	}

	if (url) {
		const a = document.createElement('a');
		a.href = url;
		a.download = 'qrcode_' + Date.now() + '.png';
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
		showToast('✓ 已保存二维码图片');
	} else {
		showToast('⚠️ 请先输入内容生成二维码');
	}
}

// 拖拽文件上传支持
const dropArea = document.getElementById('dropArea');
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
	dropArea.addEventListener(eventName, e => {
		e.preventDefault();
		e.stopPropagation();
	}, false);
});

['dragenter', 'dragover'].forEach(eventName => {
	dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
});
['dragleave', 'drop'].forEach(eventName => {
	dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
});

dropArea.addEventListener('drop', (e) => {
	const files = e.dataTransfer.files;
	handleFiles(files);
});

function handleFileSelect(e) {
	const files = e.target.files;
	handleFiles(files);
}

function handleFiles(files) {
	if (!files || files.length === 0) return;
	const file = files[0];
	
	if (!file.type.match('image.*')) {
		showToast('⚠️ 仅支持图片文件格式');
		return;
	}

	const reader = new FileReader();
	reader.onload = (e) => {
		const img = new Image();
		img.onload = () => {
			const canvas = document.createElement('canvas');
			const ctx = canvas.getContext('2d', { willReadFrequently: true });
			
			const MAX_WIDTH = 1200;
			let width = img.width;
			let height = img.height;
			
			if (width > MAX_WIDTH) {
				height = Math.round(height * (MAX_WIDTH / width));
				width = MAX_WIDTH;
			}
			
			canvas.width = width;
			canvas.height = height;
			ctx.drawImage(img, 0, 0, width, height);
			
			const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			
			if (typeof jsQR !== 'undefined') {
				const code = jsQR(imageData.data, imageData.width, imageData.height, {
					inversionAttempts: "dontInvert",
				});
				
				if (code) {
					showDecodeResult(code.data);
				} else {
					showToast('❌ 未能在该图片中识别到有效二维码');
				}
			} else {
				showToast('⚠️ 解析引擎加载中，请稍候重试');
			}
		};
		img.src = e.target.result;
	};
	reader.readAsDataURL(file);
}

function showDecodeResult(text) {
	const area = document.getElementById('decodeResultArea');
	const textArea = document.getElementById('decodeResultText');
	area.style.display = 'block';
	textArea.value = text;
	showToast('✓ 二维码识别成功');
}

function copyResult() {
	const textArea = document.getElementById('decodeResultText');
	const text = textArea.value;
	if (!text) return;
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(text).then(() => showToast('✓ 已复制到剪贴板'));
	} else {
		textArea.select();
		document.execCommand('copy');
		showToast('✓ 已复制到剪贴板');
	}
}

// 主题同步
function syncTheme() {
	try {
		const isDark = window.parent.document.documentElement.classList.contains('dark') || 
		               window.parent.document.documentElement.getAttribute('data-theme') === 'dark';
		if (isDark) {
			document.documentElement.setAttribute('data-theme', 'dark');
			document.body.classList.add('dark');
		} else {
			document.documentElement.removeAttribute('data-theme');
			document.body.classList.remove('dark');
		}
	} catch (e) {}
}
window.addEventListener('DOMContentLoaded', syncTheme);
const observer = new MutationObserver(syncTheme);
try {
	observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
} catch (e) {}
</script>
</body>
</html>
